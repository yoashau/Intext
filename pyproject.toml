[project]
name = "intext"
version = "0.2.0"
description = "Windows selection translator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
windows = [
    "pywebview>=5.3",
    "Pillow>=11,<13",
    "rapidocr==3.10.0; sys_platform == 'win32'",
    "onnxruntime>=1.23,<2; sys_platform == 'win32'",
]

[project.scripts]
intext = "intext.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intext = ["assets/*", "assets/**/*"]
